# Sample configuration to validate/compile the crow_alarm_panel component.
# Replace pin numbers and other values to match your hardware.
#
# Usage:
#   esphome config crow_alarm_panel_test.yaml      # validate config
#   esphome compile crow_alarm_panel_test.yaml     # compile firmware

esphome:
  name: crow-alarm-panel-test
  friendly_name: Crow Alarm Panel Test

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: '3.1'

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components

crow_alarm_panel:
  clock_pin: GPIO18
  data_pin: GPIO19
  address: 8

  keypads:
    # Optional: label other keypads for logging
    - name: "Main Keypad"
      address: 0
    - name: "Control 4 Keypad"
      address: 8

  on_message:
    - lambda: |-
        ESP_LOGI("crow_alarm_panel", "%02x - %s", type, format_hex_pretty(data).c_str());

text_sensor:
  - platform: crow_alarm_panel
    name: "Alarm Armed State"
    type: armed_state

binary_sensor:
  - platform: crow_alarm_panel
    device_class: motion
    icon: mdi:motion-sensor
    name: "Zone 1"
    type: zone
    zone: 1

  - platform: crow_alarm_panel
    name: "Zone 1 Bypassed"
    type: bypass
    zone: 1

alarm_control_panel:
  - platform: crow_alarm_panel
    name: "Crow Alarm"
    requires_code: true
    requires_code_to_arm: false

button:
  - platform: crow_alarm_panel
    name: "Arm Away"
    type: arm_away

  - platform: crow_alarm_panel
    name: "Arm Stay"
    type: arm_stay

  - platform: crow_alarm_panel
    name: "Disarm"
    type: disarm
    code: !secret alarm_code

switch:
  - platform: crow_alarm_panel
    type: output
    output: 3
    name: "Gate"
  - platform: crow_alarm_panel
    type: output
    output: 4
    name: "Garage Door"
