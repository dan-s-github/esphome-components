# Sample configuration to validate/compile the crow_alarm_panel component.
# Replace pin numbers and other values to match your hardware.
#
# Usage:
#   esphome config crow_alarm_panel_test.yaml      # validate config
#   esphome compile crow_alarm_panel_test.yaml     # compile firmware

esphome:
  name: crow-alarm-panel-test
  friendly_name: Crow Alarm Panel Test

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: '3.1'

# Enable logging at VERY_VERBOSE so every ESP_LOGV/ESP_LOGVV call site actually
# compiles (log macros below the configured level compile out entirely), keeping
# this fixture's compile check able to catch format-string issues in verbose logs.
logger:
  level: VERY_VERBOSE

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components

crow_alarm_panel:
  clock_pin: GPIO18
  data_pin: GPIO19
  address: 7
  # Panel-level alarm code; the disarm button and alarm control panel use it
  # unless they set their own `code:`.
  code: !secret alarm_code

  keypads:
    # Optional: label other keypads for logging
    - name: "Main Keypad"
      address: 0
    - name: "Control 4 Keypad"
      address: 7

  # Each zone entry creates a zone binary sensor and a switch that toggles bypass
  # via the keypad BYPASS sequence (the switch state mirrors the panel's bypass bitmap).
  zones:
    - zone: 1
      device_class: motion  # entities: "Zone 1" sensor, "Bypass 1" switch
      icon: mdi:motion-sensor
    - zone: 2
      name: "Front Door"    # entities: "Front Door" sensor, "Bypass Front Door" switch
      device_class: door

  on_message:
    - lambda: |-
        ESP_LOGI("crow_alarm_panel", "%02x - %s", type, format_hex_pretty(data).c_str());

text_sensor:
  - platform: crow_alarm_panel
    name: "Alarm Armed State"
    type: armed_state

# Standalone zone sensors remain supported for zones that don't need
# the full auto-generated entity set.
binary_sensor:
  - platform: crow_alarm_panel
    device_class: motion
    icon: mdi:motion-sensor
    name: "Zone 3"
    type: zone
    zone: 3

alarm_control_panel:
  - platform: crow_alarm_panel
    name: "Crow Alarm"
    requires_code_to_arm: false

button:
  - platform: crow_alarm_panel
    name: "Arm Away"
    type: arm_away

  - platform: crow_alarm_panel
    name: "Arm Stay"
    type: arm_stay

  - platform: crow_alarm_panel
    name: "Disarm"
    type: disarm

switch:
  - platform: crow_alarm_panel
    type: output
    output: 3
    name: "Gate"
  - platform: crow_alarm_panel
    type: output
    output: 4
    name: "Garage Door"
  # Standalone bypass switch (state + control) for a zone not using `zones:`.
  - platform: crow_alarm_panel
    type: bypass
    zone: 3
    name: "Zone 3 Bypass"
